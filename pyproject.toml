[project]
name = "bcra-pagos-minoristas-xlsx-to-parquet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emilio Dávola", email = "emidavola@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "polars>=1.41.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "tomli>=2.4.1",
    "typer>=0.25.1",
]

[project.scripts]
bcra-pagos-minoristas-xlsx-to-parquet = "bcra_pagos_minoristas_xlsx_to_parquet:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pre-commit>=4.6.0",
    "black>=24.10.0",
    "isort>=5.12.0",
    "ruff>=0.12.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["data/raw", "build", "dist", ".venv", "venv", "node_modules"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
