[project]
name = "bcra-pagos-minoristas-xlsx-to-parquet"
version = "0.1.0"
description = "ETL pipeline to discover, download, parse, normalize and store BCRA minor payment data from XLSX to Parquet"
readme = "README.md"
authors = [
    { name = "Emilio Dávola", email = "emidavola@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "polars>=1.41.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "tomli>=2.4.1",
    "typer>=0.25.1",
]

[project.scripts]
bcra-pagos-minoristas-xlsx-to-parquet = "bcra_pagos_minoristas_xlsx_to_parquet:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.6.0",
    "black>=24.10.0",
    "isort>=5.12.0",
    "ruff>=0.12.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["data/raw", "build", "dist", ".venv", "venv", "node_modules"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
